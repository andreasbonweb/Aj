.o.ok small,.o.no small,.o.dk.on small{color:var(--t)}
.k{display:inline-block;width:22px;color:var(--m);font-weight:600}
#nx{margin-top:10px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;display:none}
.pg{height:6px;background:var(--b);border-radius:3px;margin-bottom:12px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ok);width:0}

 const pool=Object.keys(m).filter(n=>n!==q.n).map(n=>({t:n,w:"“"+n+"” refers to “"+rnd(m[n])+"”, so it does not fit this prompt."}));
 (G[q.g][2]||[]).forEach(e=>{if(e[0]!==q.n)pool.push({t:e[0],w:"“"+e[0]+"” "+e[1]+"."})});
 pool.forEach(p=>p.k=Math.abs(p.t.length-q.n.length)+Math.random()*10);
 pool.sort((a,b)=>a.k-b.k);
 return[{t:q.n,w:"“"+q.n+"” fits: the slides describe it as “"+q.d+"”.",ok:true},...pool.slice(0,3).map(p=>({t:p.t,w:p.w,ok:false}))]}
//ENGINE
const $=id=>document.getElementById(id),SK="se_drill_v2",W=[10,5,2.5,1.2,.6];
let S={s:{},t:0,ok:0,n:0,k:0},cur=null,done=false,rq=[],recent=[];
try{S=Object.assign(S,JSON.parse(localStorage.getItem(SK)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
const rec=id=>S.s[id]||(S.s[id]={b:0,n:0,u:0});
function pick(){
 const di=rq.findIndex(x=>x.at<=S.t&&!recent.slice(-1).includes(x.id));
 if(di>=0)return Q.find(q=>q.id==rq.splice(di,1)[0].id);
 const pool=Q.filter(q=>!recent.slice(-4).includes(q.id)),ws=pool.map(q=>{const r=S.s[q.id];return r?W[r.b]:6});
 let x=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i]}return pool[0]}
function show(){
 cur=pick();done=false;const op=$("op");op.innerHTML="";$("nx").style.display="none";
 $("tg").textContent=cur.c?"Detail":G[cur.g][0].replace(/^Which /,"");$("st").textContent=cur.s;
 const os=build(cur).sort(()=>Math.random()-.5);
 os.forEach((o,i)=>{const b=document.createElement("button");b.className="o";b.innerHTML='<span class="k">'+"ABCD"[i]+'</span>';b.append(o.t);b.onclick=()=>ans(b,o,os,op);op.append(b)});
 const e=document.createElement("button");e.className="o dk";e.innerHTML='<span class="k">E</span>';e.append("I don’t know");e.onclick=()=>ans(e,null,os,op);op.append(e);
 stats()}
function note(el,txt){const s=document.createElement("small");s.textContent=txt;el.append(s)}
function ans(b,o,os,op){
 if(done)return;done=true;const r=rec(cur.id);S.t++;S.n++;r.n++;
 const right=!!(o&&o.ok);
 if(right){S.ok++;S.k++;r.b=Math.min(4,r.b+1)}else{S.k=0;r.b=0;if(!o)r.u++;rq.push({id:cur.id,at:S.t+2+Math.floor(Math.random()*3)})}
 recent.push(cur.id);
 const kids=[...op.children];
 kids.slice(0,4).forEach((el,i)=>{const x=os[i];el.disabled=true;
  if(x.ok){el.classList.add("ok");note(el,"✔ "+x.w)}
  else if(el===b){el.classList.add("no");note(el,"✘ Your choice. "+x.w)}
  else if(!right){note(el,"✘ "+x.w)}});
 kids[4].disabled=true;
 if(!o){kids[4].classList.add("on");note(kids[4],"No guess made. Marked as not known; the correct answer is shown above and this question will come back soon.")}
 $("nx").style.display="inline-block";save();stats()}
function stats(){
 const v=Object.values(S.s);$("s1").textContent=v.length;$("tot").textContent=Q.length;
 $("s2").textContent=S.n?Math.round(100*S.ok/S.n)+"%":"–";$("s3").textContent=S.k;
 $("s5").textContent=v.reduce((a,r)=>a+(r.u||0),0);
 const m=v.filter(r=>r.b>=3).length;$("s4").textContent=m;$("pg").style.width=100*m/Q.length+"%"}
$("nx").onclick=show;
$("rs").onclick=()=>{if(confirm("Erase all progress?")){S={s:{},t:0,ok:0,n:0,k:0};rq=[];recent=[];save();show()}};
document.addEventListener("keydown",e=>{
 const k=e.key.length===1?e.key.toLowerCase():"";
 let i="12345".indexOf(k);if(i<0)i="abcde".indexOf(k);
 if(!done&&i>=0&&k){const b=$("op").children[i];b&&b.click()}
 else if((e.key=="Enter"||e.key==" ")&&done){e.preventDefault();show()}});
show();
</script></body></html>
